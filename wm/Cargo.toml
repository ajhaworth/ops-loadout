[package]
name = "loadout-wm"
# Bumping this is what makes installers/loadout-wm.{sh,ps1} replace the installed copy (and, on macOS, ask for
# Accessibility again), so bump it only when wm/ changes. Keep WM_VERSION in both scripts in step (smoke.sh checks).
version = "0.3.1"
edition = "2021"
description = "Fills the screen with the windows of listed apps; everything else floats"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSDistributedNotificationCenter", "NSDictionary", "NSString", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
