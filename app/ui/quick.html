<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loadout Tray</title>
<style>
  :root {
    --fg: #16181d;
    --dim: #6b7280;
    --line: rgba(0, 0, 0, 0.1);
    --sel: rgba(0, 0, 0, 0.08);
    --field: rgba(255, 255, 255, 0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f2f2f4;
      --dim: #a4a6ad;
      --line: rgba(255, 255, 255, 0.12);
      --sel: rgba(255, 255, 255, 0.12);
      --field: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    /* No decorations, so the corners are ours to round. */
    border-radius: 10px;
    overflow: hidden;
  }
  body {
    background: transparent;
    color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 8px;
    gap: 6px;
  }
  #q {
    flex: none;
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--field);
    color: var(--fg);
    font: inherit;
    outline: none;
    -webkit-appearance: none;
  }
  #list {
    flex: 1;
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-y: auto;
  }
  #list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: default;
    white-space: nowrap;
    overflow: hidden;
  }
  #list li.selected { background: var(--sel); }
  #list img { width: 18px; height: 18px; flex: none; }
  #list span { overflow: hidden; text-overflow: ellipsis; }
  #empty { color: var(--dim); padding: 6px 8px; }
  footer { flex: none; border-top: 1px solid var(--line); padding-top: 6px; }
  #open-full {
    width: 100%;
    padding: 5px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    cursor: default;
  }
  #open-full:hover { background: var(--sel); color: var(--fg); }
</style>
</head>
<body>
  <input id="q" type="search" placeholder="Launch…" autocomplete="off" spellcheck="false" />
  <ul id="list"></ul>
  <footer><button id="open-full">Open Loadout</button></footer>
  <script src="quick.js"></script>
</body>
</html>
