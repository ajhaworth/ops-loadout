[package]
name = "loadout"
version = "0.8.1"
edition = "2021"
rust-version = "1.77"
description = "Tracks, installs and configures the apps a workstation runs"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
base64 = "0.22"

[profile.release]
strip = true
