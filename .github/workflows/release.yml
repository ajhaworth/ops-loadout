# Builds Launchbay and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0, or run it by hand from the Actions tab.
# A release carries only the two installers - the macOS dmg and the Windows
# NSIS exe - and the `prune` job deletes every older release and tag, so only
# the latest one exists.
# The app is unsigned (no Apple Developer ID), so a downloaded copy needs
# System Settings > Privacy & Security > Open Anyway, or
#   xattr -dr com.apple.quarantine "/Applications/Launchbay.app"
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --bundles dmg
            artifact: app/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis
            artifact: app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # Only cut a release on a tag; a manual run just uploads the artifact.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Launchbay ${{ github.ref_name }}
          releaseBody: |
            Standalone macOS build, not notarized. If macOS says the app is damaged, drag it to Applications and run once:

                xattr -dr com.apple.quarantine "/Applications/Launchbay.app"
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Launchbay-${{ runner.os }}
          path: ${{ matrix.artifact }}

  prune:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --json tagName -q '.[].tagName' \
            | grep -vx "$GITHUB_REF_NAME" \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
