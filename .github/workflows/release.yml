# Builds Loadout and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0, or run it by hand from the Actions tab.
# A release carries the two installers - the macOS dmg and the Windows NSIS
# exe - plus Loadout WM for each (loadout-wm-{macos,windows}.zip), and the
# `prune` job deletes every older release and tag, so only the latest exists.
# The app is unsigned (no Apple Developer ID), so a downloaded copy needs
# System Settings > Privacy & Security > Open Anyway, or
#   xattr -dr com.apple.quarantine "/Applications/Loadout.app"
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --bundles dmg
            artifact: app/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis
            artifact: app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            wm
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # Only cut a release on a tag; a manual run just uploads the artifact.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Loadout ${{ github.ref_name }}
          releaseBody: |
            Standalone macOS build, not notarized. If macOS says the app is damaged, drag it to Applications and run once:

                xattr -dr com.apple.quarantine "/Applications/Loadout.app"
      # Loadout WM (wm/) rides along as its own asset, under a fixed name so the installers can fetch it from
      # releases/latest/download without the API. The version inside the zip is what they compare.
      - name: Build Loadout WM (macOS)
        if: runner.os == 'macOS'
        working-directory: wm
        run: |
          cargo build --release
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="dist/Loadout WM.app"
          mkdir -p "$app/Contents/MacOS"
          cp Info.plist "$app/Contents/"
          plutil -insert CFBundleShortVersionString -string "$v" "$app/Contents/Info.plist"
          cp target/release/loadout-wm "$app/Contents/MacOS/"
          codesign --force --sign - --identifier dev.alx.loadout-wm "$app"
          (cd dist && ditto -c -k --keepParent "Loadout WM.app" ../loadout-wm-macos.zip)
      - name: Build Loadout WM (Windows)
        if: runner.os == 'Windows'
        working-directory: wm
        shell: pwsh
        run: |
          cargo build --release
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/loadout-wm.exe dist/
          Set-Content -Path dist/version.txt -Value $v -NoNewline
          Compress-Archive -Path dist/* -DestinationPath loadout-wm-windows.zip
      - name: Attach Loadout WM
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: wm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" loadout-wm-*.zip --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Loadout-${{ runner.os }}
          path: |
            ${{ matrix.artifact }}
            wm/loadout-wm-*.zip

  prune:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --json tagName -q '.[].tagName' \
            | grep -vx "$GITHUB_REF_NAME" \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
