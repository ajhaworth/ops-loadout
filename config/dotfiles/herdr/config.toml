onboarding = false

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_scope = "all"
agent_panel_sort = "priority"   # blocked/done first
sidebar_width = 32              # 26 truncated workspace names
sidebar_max_width = 40

# One line per workspace on main; the branch shows only when it isn't main.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "git_status"],
  [{ token = "branch", dim = true, rules = [{ equals = "main", hide = true }, { equals = "master", hide = true }] }],
]

# Every agent is Claude, so show its session title instead of "claude".
# Machine label hidden for Local, teal for remotes.
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "machine", fg = "#94e2d5", rules = [{ equals = "Local", hide = true }] }, "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.toast]
delivery = "off"      # notifications handled by a separate app

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false
