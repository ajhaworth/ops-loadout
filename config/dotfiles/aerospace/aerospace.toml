# AeroSpace gives each everyday app its own workspace, where its windows tile to fill the screen like a macOS full-screen
# Space: Blender (plus the Claude Code Ghostty its Loadout tab opens, see
# config/dcc/blender/portable/scripts/startup/dcc_claude.py), Houdini, Godot, Unreal, Ghostty, Zen, Mail, Messages, Calendar, Agenda,
# Digest, Pulse, ChatGPT, Claude, Slack, Safari, Obsidian, Spotify, Fork, Simulator and Loadout. Opening or clicking an app switches to its workspace. Every other window
# floats, Finder's included: AeroSpace sees each native tab as a window, so tiled Finder tabs leave holes in the layout.
# Key bindings sit behind Caps Lock (remapped to F18 by capslock-f18.plist): AeroSpace's sample Option chords would
# take keys Blender's keymap uses.
config-version = 2
start-at-login = true

# The centered floating windows (Messages, Simulator, Loadout; see their rules) snap back to center whenever their
# workspace is shown, so a window dragged aside never stays there. The previous workspace is recorded for Caps Lock, Enter.
exec-on-workspace-change = ['/bin/bash', '-c', '''
    printf %s "$AEROSPACE_PREV_WORKSPACE" > /tmp/aerospace-prev-workspace
    c() { osascript -l JavaScript ~/.config/aerospace/center.js "$@"; }
    case "$AEROSPACE_FOCUSED_WORKSPACE" in
        Messages) c com.apple.MobileSMS 760 ;;
        Simulator) c com.apple.iphonesimulator ;;
        Loadout) c dev.alx.loadout Loadout ;;
    esac
''']

# A mode has no on-screen indicator, so leaving one open would keep eating its keys in apps; any focus change (a
# click, Cmd-Tab, a workspace switch) drops back to main.
# Closing a window sends AeroSpace back to that window's workspace, which with one app per workspace is now empty, while
# macOS has already made another app frontmost. That app's window stays parked on its hidden workspace, and clicking it
# in the Dock changes nothing macOS reports, so it could not be reached until another app was clicked first. So focus
# landing on an empty workspace follows macOS's frontmost app instead; an app left with no windows keeps the empty one.
on-focus-changed = ['mode main', '''exec-and-forget PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH";
    [ "$(aerospace list-windows --workspace focused --count)" = 0 ] || exit 0
    bid=$(lsappinfo info -only bundleID "$(lsappinfo front)" | sed -n 's/.*bundleID="\(.*\)"/\1/p')
    id=$(aerospace list-windows --monitor all --app-bundle-id "$bid" --format %{window-id} | head -1)
    [ -n "$id" ] && aerospace focus --window-id "$id"''']

# Caps Lock (F18) enters mode "window". Enter, F and R run once and drop back to main; arrows and -/= move on to mode
# "repeat", where only they stay bound (so F and Enter reach the app again) for repeated presses, until Caps Lock or
# Esc. F18 is a plain key, so AeroSpace cannot see it held down.
# One-off tiling beside another app: switch to the app, then Caps Lock, Enter sends its window back to the workspace
# you came from, tiled, with focus following. Doing it again returns it. move-node-to-workspace has no "previous"
# target, hence the file written above. The CLI is in ~/.local/bin (installers/aerospace.sh) or Homebrew.
# R flattens and rebalances a workspace whose splits got tangled by moves.
[mode.main.binding]
f18 = 'mode window'

[mode.window.binding]
enter = ['mode main', '''exec-and-forget PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH";
    aerospace move-node-to-workspace --focus-follows-window "$(cat /tmp/aerospace-prev-workspace)" && aerospace layout tiling''']
f = ['mode main', 'layout floating tiling']
r = ['mode main', 'flatten-workspace-tree', 'balance-sizes']
left = ['mode repeat', 'move left']
right = ['mode repeat', 'move right']
minus = ['mode repeat', 'resize smart -50']
equal = ['mode repeat', 'resize smart +50']
esc = 'mode main'
f18 = 'mode main'

[mode.repeat.binding]
left = 'move left'
right = 'move right'
minus = 'resize smart -50'
equal = 'resize smart +50'
esc = 'mode main'
f18 = 'mode main'

# The margin macOS's own window tiling leaves, around and between tiled windows.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# Blender's main window is titled "<file> - Blender <version>"; Preferences and File View float with the rest.
# It gets workspace "Blender" to itself, which acts as its full screen.
[[on-window-detected]]
if.app-id = 'org.blenderfoundation.blender'
if.window-title-regex-substring = ' - Blender \d'
run = ['layout tiling', 'move-node-to-workspace Blender', 'exec-and-forget ~/.config/aerospace/follow.sh']

# A Ghostty window opened on Blender's workspace stays there, tiled: that is the Claude Code window from Blender's
# Loadout tab, which the launcher then moves left and sizes. Keyed on the workspace, not the title, because Ghostty
# sets its title only after AeroSpace detects the window.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty && test %{workspace} = Blender'
run = 'layout tiling'

# Every other Ghostty window tiles on its own workspace, "Ghostty". AeroSpace follows macOS focus there by itself,
# as it does for the workspaces below.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace Ghostty', 'exec-and-forget ~/.config/aerospace/follow.sh']

# Houdini's main window only, as with Blender ("<file>.hip - Houdini <edition> <version>", where Apprentice's edition is
# two words: "Houdini Apprentice Non-Commercial 22.0.429"); floating panes stay floating.
[[on-window-detected]]
if.app-name-regex-substring = '^Houdini'
if.window-title-regex-substring = ' - Houdini [^0-9]+\d'
run = ['layout tiling', 'move-node-to-workspace Houdini', 'exec-and-forget ~/.config/aerospace/follow.sh']

# Godot's editor ("<project> - Godot Engine") and Project Manager ("Godot Engine - Project Manager"); dialogs and the
# running game ("<project> (DEBUG)") are separate windows with other titles, so they float.
[[on-window-detected]]
if.app-id = 'org.godotengine.godot'
if.window-title-regex-substring = 'Godot Engine'
run = ['layout tiling', 'move-node-to-workspace Godot', 'exec-and-forget ~/.config/aerospace/follow.sh']

# Unreal Editor's main window ("<project> - Unreal Editor"); the splash screen and tool windows float.
# ponytail: bundle id and title pattern unverified (no Unreal on the Mac this was written on); check on first launch.
[[on-window-detected]]
if.app-id = 'com.epicgames.UnrealEditor'
if.window-title-regex-substring = ' - Unreal Editor'
run = ['layout tiling', 'move-node-to-workspace Unreal', 'exec-and-forget ~/.config/aerospace/follow.sh']

# Loadout's main window ("Loadout"), not its tray popup ("Loadout Tray"). Its max width would leave it tiled against the
# left edge, so it floats, centered at full height by center.js, which
# exec-on-workspace-change runs once follow.sh shows the workspace: AeroSpace puts a window moved while its workspace
# is hidden back where it was when that workspace reappears.
[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.alx.loadout && test %{window-title} = Loadout'
run = ['layout floating', 'move-node-to-workspace Loadout', 'exec-and-forget ~/.config/aerospace/follow.sh']

# One workspace per app. follow.sh then shows that workspace if the app is frontmost: otherwise the window would sit on
# a hidden workspace while its app is frontmost, and clicking an already-frontmost app in the Dock does nothing. A window
# opened in the background stays put, since following it would hide the app you are in (see follow.sh).
# Its normal windows tile there, so a second one (a compose window) splits it; dialogs, panels
# and picture-in-picture float on it by AeroSpace's own heuristic, which a 'layout tiling' here would override.
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace Zen', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace Mail', 'exec-and-forget ~/.config/aerospace/follow.sh']

# Messages reads best narrow, so it floats at 760 px, centered the same way as Loadout.
[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['layout floating', 'move-node-to-workspace Messages', 'exec-and-forget ~/.config/aerospace/follow.sh']

# The iOS Simulator keeps its device's aspect ratio, so tiling would leave it against the left edge: it floats, centered
# at full height, its width following the device.
[[on-window-detected]]
if.app-id = 'com.apple.iphonesimulator'
run = ['layout floating', 'move-node-to-workspace Simulator', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = ['move-node-to-workspace Calendar', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'dev.alx.Digest'
run = ['move-node-to-workspace Digest', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'dev.alx.Agenda'
run = ['move-node-to-workspace Agenda', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = ['move-node-to-workspace ChatGPT', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace Claude', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace Slack', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace Safari', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace Obsidian', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'dev.alx.Pulse'
run = ['move-node-to-workspace Pulse', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace Spotify', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if.app-id = 'com.DanPristupov.Fork'
run = ['move-node-to-workspace Fork', 'exec-and-forget ~/.config/aerospace/follow.sh']

[[on-window-detected]]
if = 'true'
run = 'layout floating'
