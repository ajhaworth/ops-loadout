# workstation.conf - Work Mac: everything installs through the Ops Launcher, never Homebrew
PROFILE_OS="macos"
PROFILE_DESCRIPTION="Work Mac: installs through the launcher only, no Homebrew"
PROFILE_HOMEBREW="false"        # hides every formula/cask/mas app; launcher never runs brew or mas
PROFILE_APPLY_DEFAULTS="false"
PROFILE_DOTFILES="true"          # terminal config only, applied from the launcher's Updates tab
DOTFILES_SHELL="true"            # bashrc, shell colors, starship prompt
DOTFILES_GHOSTTY="true"          # Ghostty terminal
DOTFILES_ZSHRC="false"           # leave the work-issued zshrc alone
DOTFILES_GIT="false"             # leave the work git identity alone
PROFILE_MAS="false"
PROFILE_JAPANESE_INPUT="false"
INSTALLERS_CREATIVE="false"     # sidefxlabs, compositor
INSTALLERS_MEDIA="false"        # moonlight-nightly
