# workstation.conf - Work Mac: a short allow-list, installed from the Ops Launcher
#
# Apps: Blender, Houdini, Fork, Ghostty (installer scripts) plus the core and
# shell CLI tools the dotfiles expect. Homebrew is bootstrapped from the
# launcher's Updates tab. Set PROFILE_HOMEBREW="false" instead to drop every
# brew/mas package and keep the launcher from running brew at all.
PROFILE_OS="macos"
PROFILE_DESCRIPTION="Work Mac: Blender, Houdini, Fork, Ghostty and core CLI tools"
PROFILE_APPLY_DEFAULTS="false"
PROFILE_DOTFILES="true"          # terminal config only, applied from the launcher's Updates tab
DOTFILES_SHELL="true"            # bashrc, shell colors, starship prompt
DOTFILES_GHOSTTY="true"          # Ghostty terminal
DOTFILES_ZSHRC="true"            # the work zshrc is backed up; put work-only lines in ~/.zshrc.local
DOTFILES_GIT="false"             # leave the work git identity alone
PROFILE_MAS="false"

# Formulae: CLI tools only (all permissive/GPL, no third-party taps)
FORMULAE_CORE="true"
FORMULAE_SHELL="true"            # starship, eza, bat, fzf... used by the dotfiles
FORMULAE_SOFTWARE_DEV="false"
FORMULAE_DEVOPS="false"
FORMULAE_MEDIA="false"           # includes a third-party tap

# Casks: none; Fork and Ghostty come from installer scripts
CASKS_PRODUCTIVITY="false"
CASKS_LEARNING="false"
CASKS_DEVELOPMENT="false"
CASKS_UTILITIES="false"
CASKS_POWER_USER="false"
CASKS_BROWSERS="false"
CASKS_CREATIVE="false"
CASKS_MEDIA="false"
PROFILE_JAPANESE_INPUT="false"
INSTALLERS_CREATIVE="false"     # sidefxlabs, compositor
INSTALLERS_MEDIA="false"        # moonlight-nightly
