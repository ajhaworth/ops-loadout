# windows.conf - Gaming workstation setup for Windows
#
# Gaming and streaming box that doubles as a light dev machine.

# Profile metadata
PROFILE_OS="windows"
PROFILE_DESCRIPTION="Windows gaming workstation"

# Dotfiles
# Deliberately git-only: this box is not a terminal-driven machine, so no
# PowerShell profile, prompt or terminal config is managed here.
PROFILE_DOTFILES="true"        # Enable dotfile symlinks
DOTFILES_GIT="true"            # Git configuration

# Package installation
PROFILE_PACKAGES="true"

# Winget categories
WINGET_CORE="true"             # Git, gh, VS Code, PowerShell, Terminal, Fork, P4V
WINGET_BROWSERS="true"         # Helium
WINGET_PRODUCTIVITY="true"     # 1Password, Nextcloud
WINGET_MEDIA="true"            # Spotify
WINGET_CREATIVE="true"         # Blender
WINGET_GAMING="true"           # Steam, Playnite, XIVLauncher, GOG Galaxy
WINGET_EMULATORS="true"        # DuckStation, Cemu
WINGET_AI="true"               # ComfyUI Desktop, Claude

# GitHub release categories (apps with no winget/choco package)
GITHUB_GAMING="true"           # Vibepollo

# ComfyUI custom nodes (cloned into the app's custom_nodes/)
COMFYNODES_CORE="true"         # LoRA Manager

# Chocolatey categories
CHOCO_GAMING="true"            # Epic Games Launcher, Moonlight
CHOCO_PRODUCTIVITY="true"      # NVIDIA App (winget only has the msstore build)
CHOCO_EMULATORS="true"         # RetroArch, Dolphin, PCSX2

# System preferences (platforms/windows/defaults/*.ps1)
PROFILE_APPLY_DEFAULTS="true"
DEFAULTS_APPEARANCE="true"     # Dark mode
DEFAULTS_EXPLORER="true"       # File extensions, hidden files, Quick Access
DEFAULTS_TASKBAR="true"        # Left align, hide widgets/chat/search
DEFAULTS_PRIVACY="true"        # Advertising ID, telemetry, activity history
DEFAULTS_POWER="true"          # Never sleep, no Fast Startup (needed for WoL)
DEFAULTS_COMFYUI="true"        # Point ComfyUI Desktop at the shared model library
DEFAULTS_COMFYUI_NETWORK="true" # Serve ComfyUI to the LAN

# ComfyUI Desktop installs to its own default location. Only the model library
# is redirected, via extra_model_paths.yaml in the backend directory. The folder
# names under this path are matched at apply time.
#
# Local rather than the \\TRUENAS\apps\diffusion share: loading models over SMB
# was too slow to work with. The NAS copy is kept as a manual archive. This
# directory uses ComfyUI's own folder names, so the mapping is 1:1.
COMFYUI_MODEL_PATH="D:\diffusion"

# LAN access. Binds the backend to 0.0.0.0 and opens the port to the local
# subnet on private networks. Auth comes from ComfyUI-Login (comfynodes/core.txt)
# - the password is set on first visit, never stored here. With REQUIRE_AUTH on,
# the firewall stays shut until that node is installed.
COMFYUI_LISTEN="true"
COMFYUI_PORT="8188"
COMFYUI_REQUIRE_AUTH="true"

# Debloat (disabled by default - removes Windows bloatware)
PROFILE_DEBLOAT="false"
