# windows.conf - Gaming workstation setup for Windows
#
# Gaming and streaming box that doubles as a light dev machine.

# Profile metadata
PROFILE_OS="windows"
PROFILE_DESCRIPTION="Windows gaming workstation"

# Dotfiles
# Git, the terminal and the window manager. No PowerShell profile or prompt:
# this box is not terminal-driven.
PROFILE_DOTFILES="true"        # Enable dotfile symlinks
DOTFILES_GIT="true"            # Git configuration
DOTFILES_WEZTERM="true"        # WezTerm, styled like the Mac's Ghostty
DOTFILES_GLAZEWM="true"        # GlazeWM, a port of the Mac's aerospace.toml (+ Caps Lock -> F18 in DEFAULTS_SYSTEM)

# Package installation
PROFILE_PACKAGES="true"

# winget categories (config/packages/windows/winget/*.txt)
WINGET_BROWSERS="true"         # Zen
WINGET_CREATIVE="true"         # ComfyUI Desktop (+ its nodes, model library and LAN access, below)

# Loadout installer scripts (config/packages/windows/installers/*.txt)
INSTALLERS_3D="true"           # Blender, Houdini, configured from config/dcc
INSTALLERS_GAMING="true"       # NVIDIA app
WINGET_DEVELOPMENT="true"      # P4V, WezTerm, Godot
WINGET_GAMING="true"           # Steam, XIVLauncher, Epic, GOG Galaxy, 8BitDo
WINGET_MEDIA="true"            # Spotify, VLC
WINGET_PRODUCTIVITY="true"     # 1Password, Nextcloud, Claude, 7-Zip
WINGET_WINDOW_MANAGEMENT="true" # GlazeWM, PowerToys

# GitHub release categories (apps with no winget package)
GITHUB_GAMING="true"           # Vibepollo (+ sunshine.conf: no update nag, applied with it)

# ComfyUI custom nodes, installed with ComfyUI Desktop (cloned into its custom_nodes/)
COMFYNODES_CORE="true"         # LoRA Manager

# System preferences (platforms/windows/defaults/*.ps1)
PROFILE_APPLY_DEFAULTS="true"
DEFAULTS_APPEARANCE="true"     # Dark mode
DEFAULTS_EXPLORER="true"       # File extensions, hidden files, Quick Access, classic context menu
DEFAULTS_TASKBAR="true"        # Left align, hide widgets/chat/search/Copilot, quiet Start
DEFAULTS_PRIVACY="true"        # Advertising ID, telemetry, activity history, Recall, Copilot
DEFAULTS_POWER="true"          # Never sleep, no Fast Startup (needed for WoL)
DEFAULTS_SYSTEM="true"         # Long paths, Caps Lock -> F18
DEFAULTS_GAMING="true"         # No mouse acceleration or Sticky Keys prompt, GPU scheduling, no update restarts
DEFAULTS_WALLPAPER="true"      # Desktop wallpaper from config/wallpapers/windows.jpg

# Applied with every ComfyUI install/update from Loadout (comfyui.psm1), not as
# a separate setting. Leave COMFYUI_MODEL_PATH empty or COMFYUI_LISTEN false to
# skip that part.
#
# ComfyUI Desktop installs to its own default location. Only the model library
# is redirected, via extra_model_paths.yaml in the backend directory. The folder
# names under this path are matched at apply time.
#
# Local rather than the NAS share: loading models over SMB
# was too slow to work with. The NAS copy is kept as a manual archive. This
# directory uses ComfyUI's own folder names, so the mapping is 1:1.
COMFYUI_MODEL_PATH="D:\diffusion"

# LAN access. Binds the backend to 0.0.0.0 and opens the port to the local
# subnet on private networks. Auth comes from ComfyUI-Login (comfynodes/core.txt)
# - the password is set on first visit, never stored here. With REQUIRE_AUTH on,
# the firewall stays shut until that node is installed.
COMFYUI_LISTEN="true"
COMFYUI_PORT="8188"
COMFYUI_REQUIRE_AUTH="true"

# Debloat (disabled by default - removes Windows bloatware)
PROFILE_DEBLOAT="false"
